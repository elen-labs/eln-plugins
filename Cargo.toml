[package]
name = "eln-plugin-sdk"
version = "0.1.0"
edition = "2024"
description = "Plugin API platform for the elendirna project"
license = "MIT"
repository = "https://github.com/elen-labs/eln-plugins"
readme = "README.md"
keywords = ["elendirna", "plugin", "api"]
categories = ["development-tools"]

[lib]
name = "eln_plugin_sdk"
path = "src/lib.rs"

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
schemars    = "1"
bitflags    = "2"
async-trait = "0.1"
