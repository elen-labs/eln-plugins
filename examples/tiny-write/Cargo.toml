[package]
name = "tiny-write"
version = "0.1.0"
edition = "2024"
publish = false
description = "In-process SDK example — READ + WRITE tools with permission gate"

[lib]
name = "tiny_write"
path = "src/lib.rs"

[dependencies]
eln-plugin-sdk = { path = "../.." }
async-trait = "0.1"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
